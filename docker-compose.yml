# Запуск: docker compose up --build
# Откройте на ПК, телефоне и ТВ один и тот же адрес: http://<IP_вашего_компьютера>:5174
# (с телефона не используйте localhost — это сам телефон, а не сервер.)
services:
  sigame:
    build: .
    ports:
      - "5174:5174"
    environment:
      PORT: "5174"
      # Раскомментируйте для логов входа в консоль: SI_DEBUG_ROOM: "1"
